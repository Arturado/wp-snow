name: Deploy Snow WP

on:
  push:
    branches:
      - main
    paths:
      - 'wp-content/themes/snowtheme/**'
      - 'wp-content/plugins/snow-plugin/**'
      - '.github/workflows/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Theme via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          port: 22
          local_path: wp-content/themes/snowtheme/*
          remote_path: /public_html/wp-content/themes/snowtheme/
          sftp_only: true

      - name: Deploy Plugin via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          port: 22
          local_path: wp-content/plugins/snow-plugin/*
          remote_path: /public_html/wp-content/plugins/snow-plugin/
          sftp_only: true
