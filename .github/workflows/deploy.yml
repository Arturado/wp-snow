name: Deploy Snow WP

on:
  push:
    branches:
      - main
    paths:
      - 'wp-content/themes/snowtheme/**'
      - 'wp-content/plugins/snow-plugin/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Theme via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          port: 21
          protocol: ftps
          local-dir: wp-content/themes/snowtheme/
          server-dir: /public_html/wp-content/themes/snowtheme/
          dangerous-clean-slate: false

      - name: Deploy Plugin via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          port: 21
          protocol: ftps
          local-dir: wp-content/plugins/snow-plugin/
          server-dir: /public_html/wp-content/plugins/snow-plugin/
          dangerous-clean-slate: false
